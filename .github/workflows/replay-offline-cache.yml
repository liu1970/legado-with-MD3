# 自动 reapply offcache + 书架改造
#
# 拉取上游后，自动应用本次改动并跑编译验证：
#   1) checkout
#   2) 拉上游 + rebase origin/main
#   3) 跑 .github/scripts/replay-offline-cache.sh (apply patch + build verify)
#   4) 成功 → 自动 commit + 开 PR "🔁 replay: reapply offcache + 书架改造"
#   5) 失败 → 不 commit，开 "❌ replay failed: manual rebase needed" PR
#
# 触发：
#   - push 到 main（你在 web UI 点 Sync fork 后，会生成一个 merge commit 触发）
#   - workflow_run: autoupdatefork 完成后（另一种 fork 同步路径）
#   - workflow_dispatch：手动从 Actions 页面触发
#
# 不再使用 schedule cron——每次 push 已足够覆盖，schedule 会造成空跑。
#
# 注意：push 触发时只在自己仓库跑，不调用 push-to-HapeLee。

name: Reapply offcache + 书架改造

on:
  push:
    branches:
      - main
      - master
    paths:
      # 只在上游同步过来或 replay 文件本身被改时才推进；业务文件改动不需要跑这个
      - '.github/patches/**'
      - '.github/replays/**'
      - '.github/scripts/replay-offline-cache.sh'
      - '.github/workflows/replay-offline-cache.yml'
      - '.github/REAPPLY_README.md'
  workflow_run:
    workflows: [update fork]
    branches:
      - main
      - master
    types:
      - completed
  workflow_dispatch:
    inputs:
      apply_now:
        description: '立即强制 rebase + apply patch（忽略拉上游）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: replay-offcache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    # 排除上游 rebase/merge commit 与 bot 自动 commit，避免无限循环
    if: |
      (github.event_name == 'push' &&
        !startsWith(github.event.head_commit.message, 'Merge branch ') &&
        !startsWith(github.event.head_commit.message, 'update fork')) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git config --global core.fileMode false

      - name: Detect upstream remote
        id: upstream
        run: |
          # 你的 fork 上游是 HapeLee/legado-with-MD3.git
          UPSTREAM_URL="https://github.com/HapeLee/legado-with-MD3.git"
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream || { echo "WARN: upstream fetch failed"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if git rev-parse upstream/main > /dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "upstream_main=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase onto upstream/main
        if: steps.upstream.outputs.ok == 'true' && inputs.apply_now != 'true'
        run: |
          # 已是最新则跳过 rebase（避免空 commit）
          LOCAL_HEAD=$(git rev-parse HEAD)
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          if [ "$LOCAL_HEAD" = "$UPSTREAM_HEAD" ]; then
            echo "Already on upstream/main HEAD, skipping rebase"
            exit 0
          fi
          # 提前 rebase origin/main 或 upstream/main 中更新的那个
          if git rev-parse origin/main > /dev/null 2>&1; then
            ORIGIN_HEAD=$(git rev-parse origin/main)
            if [ "$UPSTREAM_HEAD" != "$ORIGIN_HEAD" ]; then
              echo "Rebasing onto upstream/main"
              if ! git rebase upstream/main; then
                echo "ERROR: rebase failed, please resolve manually"
                git rebase --abort || true
                exit 1
              fi
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove Aliyun mirrors
        run: sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Apply patch + run replay
        id: replay
        run: bash .github/scripts/replay-offline-cache.sh

      - name: Build debug APK
        if: steps.replay.outcome == 'success'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache \
            assembleAppDebug \
            2>&1 | tee build-debug.log | tail -200

      - name: Upload APK artifact
        if: steps.replay.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: legado-debug-replay
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Push replay branch + open PR
        if: steps.replay.outcome == 'success' && github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="replay/offcache-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add -A
          # 仅有 patch 已合、无新差异时不再 commit
          if ! git diff --cached --quiet; then
            git commit -m "replay: reapply offline-cache + 书架/分组改造 on top of upstream

- 自动 rebase upstream/main
- apply .github/patches/offline-cache-bookshelf-v1.patch
- verify + assembleAppDebug 已通过
- 详情见 docs/dev/offline-cache-bookshelf-rework.md"
            git push -u origin "$BRANCH"
            gh pr create \
              --title "🔁 replay: reapply offline-cache + 书架改造" \
              --base "${GITHUB_REF#refs/heads/}" \
              --head "$BRANCH" \
              --body "## 自动 reapply

本次 commit 由 \`replay-offline-cache\` workflow 自动生成，
把 \`.github/patches/offline-cache-bookshelf-v1.patch\` 套到当前 main 上。

**编译/护栏已通过**（见 workflow run）。

请同时阅读 \`docs/dev/offline-cache-bookshelf-rework.md\`。"
            echo "PR opened"
          else
            echo "No new changes to commit (patch already applied), nothing to do"
          fi

      - name: Open "manual-rebase-needed" PR on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="replay-failed-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add -A
          git commit --allow-empty -m "replay: failed; needs manual intervention"
          git push -u origin "$BRANCH" || { echo "WARN: push failed, skipping PR"; exit 0; }
          gh pr create \
            --title "❌ replay failed: manual rebase needed" \
            --base "${GITHUB_REF#refs/heads/}" \
            --head "$BRANCH" \
            --body "## ❌ 自动 replay 失败

自动应用 \`offline-cache-bookshelf-v1.patch\` 失败（patch 与上游冲突 / 编译失败）。

### 手动处理步骤

1. 拉取此 PR 的 branch 到本地：
   \`\`\`bash
   git fetch origin $BRANCH
   git checkout $BRANCH
   \`\`\`
2. 解决冲突（参考 \`docs/dev/offline-cache-bookshelf-rework.md\` §2.2）
3. 重跑 \`./gradlew verifyConfigArchitecture :app:compileAppDebugKotlin\`
4. 推送：
   \`\`\`bash
   git push origin $BRANCH
   \`\`\`

### 参考

- \`docs/dev/offline-cache-bookshelf-rework.md\` — 改动清单
- \`.github/patches/offline-cache-bookshelf-v1.patch\` — patch 本体

### Workflow run logs

${{ github.server_url }}/${{ github.repository }}/runs/${{ github.run_id }}" \
          || echo "WARN: PR create failed (gh may not be authenticated)"